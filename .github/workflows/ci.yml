name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Both commands install and run
        shell: bash
        run: |
          go install ./cmd/...
          "$(go env GOPATH)/bin/mgnt" --version
          "$(go env GOPATH)/bin/magenta" --version
      - name: Install tmux and fzf for the end to end check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y tmux fzf
          else
            brew install tmux fzf
          fi
      - name: End to end check with the real fzf
        if: runner.os != 'Windows'
        run: sh test/smoke.sh

  # Alpine is Linux with musl instead of glibc, and ships its own fzf.
  alpine:
    runs-on: ubuntu-latest
    container: golang:alpine
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache fzf tmux
      - run: go vet ./...
      - run: go test ./...
      - run: sh test/smoke.sh

  # BSD systems cannot run in a container, so they run in a virtual machine.
  # The versions are ones the action has images for (see its README).
  bsd:
    name: bsd (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '15.1'
            install: sudo pkg install -y go fzf tmux
          - os: openbsd
            version: '7.9'
            install: sudo pkg_add go fzf tmux
          - os: netbsd
            version: '11.0'
            install: sudo pkgin -y install go tmux
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Start the VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
      - name: Install Go and the tools
        run: ${{ matrix.install }}
      - name: Vet and test
        run: |
          # The packages put go in a directory that a plain ssh shell does not search.
          export PATH="$PATH:/usr/pkg/bin:/usr/local/bin"
          command -v go
          go version
          go vet ./...
          go test ./...
