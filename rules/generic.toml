# Fallback for logs no other rule file recognizes. It has no detect patterns.
name = "generic"
sample = [
  '2026-10-06 10:00:00,123 ERROR [main] Failed to connect to 10.0.0.12:5432 (id 3f2a8c1e-0b1d-4c8e-9a53-1f2e3d4c5b6a)',
  'Oct  6 10:00:01 host sshd[812]: WARN request to https://example.com/api?q=1 took 1.5s',
  '2026-10-06T10:00:02Z INFO user="alice" path=/var/log/app.log retries=3 DEBUG ok',
]

[[context.default.rule]]
regex = '\b\d{4}-\d\d-\d\d[T ]\d\d:\d\d:\d\d(?:[.,]\d+)?(?:Z|[+-]\d\d:?\d\d)?'
scope = "timestamp"

[[context.default.rule]]
regex = '^[A-Z][a-z]{2} [ \d]\d \d\d:\d\d:\d\d'
scope = "timestamp"

[[context.default.rule]]
regex = '\b[a-z][a-z0-9+.-]*://[^\s"<>)\]]+'
scope = "url"

[[context.default.rule]]
regex = '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b'
scope = "uuid"

[[context.default.rule]]
regex = '\b(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?\b'
scope = "ip"

[[context.default.rule]]
regex = '\b(?:FATAL|CRITICAL|CRIT|EMERG|PANIC)\b'
scope = "level.fatal"

[[context.default.rule]]
regex = '\b(?:ERROR|ERR|SEVERE)\b'
scope = "level.error"

[[context.default.rule]]
regex = '\b(?:WARN|WARNING)\b'
scope = "level.warn"

[[context.default.rule]]
regex = '\b(?:INFO|NOTICE)\b'
scope = "level.info"

[[context.default.rule]]
regex = '\b(?:DEBUG|TRACE)\b'
scope = "level.debug"

[[context.default.rule]]
regex = '"(?:[^"\\]|\\.)*"'
scope = "string"

[[context.default.rule]]
regex = '(?:^|[\s(=\[])(/[\w./@%+~-]+)'
captures = ["path"]

[[context.default.rule]]
regex = '\b([A-Za-z_][\w.-]*)='
captures = ["key"]

[[context.default.rule]]
regex = '\b\d+(?:\.\d+)?(?:ms|s|MB|KB|GB|%)?\b'
scope = "number"
