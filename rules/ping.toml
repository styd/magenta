# ping and ping6 output.
name = "ping"
detect = [
  '^PING \S+ \(',
  '^\d+ bytes from \S+: icmp_seq=\d+',
  '^\d+ packets transmitted, \d+ (?:packets )?received',
]
filenames = ["ping*.log", "ping*.txt"]
sample = [
  'PING example.com (93.184.216.34): 56 data bytes',
  '64 bytes from 93.184.216.34: icmp_seq=0 ttl=56 time=11.4 ms',
  '64 bytes from 93.184.216.34: icmp_seq=1 ttl=56 time=11.9 ms',
  'Request timeout for icmp_seq 2',
  '--- example.com ping statistics ---',
  '3 packets transmitted, 2 packets received, 33.3% packet loss',
  'round-trip min/avg/max/stddev = 11.4/11.6/11.9/0.2 ms',
]

[[context.default.rule]]
regex = '^(PING) (\S+) \(([^)]+)\)'
captures = ["key", "name", "ip"]

[[context.default.rule]]
regex = '^\d+ bytes from (\S+?):? (icmp_seq)=(\d+)'
captures = ["ip", "key", "number"]

[[context.default.rule]]
regex = '\b(ttl)=(\d+)'
captures = ["key", "number"]

[[context.default.rule]]
regex = '\b(time)[=<]([\d.]+ ?ms)'
captures = ["key", "duration"]

[[context.default.rule]]
regex = '(?i)^(?:Request timeout|Destination Host Unreachable|Request timed out|ping: .*)'
scope = "level.error"

[[context.default.rule]]
regex = '^(--- \S+ ping statistics ---)$'
captures = ["key"]

[[context.default.rule]]
regex = '\b(100(?:\.0)?%|[1-9]\d*(?:\.\d+)?%) (packet loss)'
captures = ["level.error", "level.error"]

[[context.default.rule]]
regex = '\b0(?:\.0)?% packet loss'
scope = "level.info"

[[context.default.rule]]
regex = '^(round-trip|rtt) (min/avg/max(?:/(?:stddev|mdev))?) = (\S+) ms'
captures = ["key", "key", "duration"]

[[context.default.rule]]
regex = '\b\d+(?:\.\d+)?\b'
scope = "number"
